spring:
  application:
    name: ruido-ocupacional
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/ruido_ocupacional}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
app:
  jwt:
    secret: ${JWT_SECRET}
server:
  error:
    include-message: never
    include-stacktrace: never
